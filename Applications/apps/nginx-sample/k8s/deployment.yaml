apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-sample
  namespace: apps
  labels:
    app: nginx-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-sample
  template:
    metadata:
      labels:
        app: nginx-sample
    spec:
      containers:
        - name: nginx-sample
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          env:
            - name: APP_VERSION
              value: VERSION_PLACEHOLDER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
